<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="300"
   height="200"
   version="1.1"
   id="svg1"
   sodipodi:docname="preload-as-fetch-in-practice.svg"
   inkscape:version="1.4 (e7c3feb1, 2024-10-09)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1">
    <filter
       id="glow"
       x="-0.071842034"
       y="-0.19199512"
       width="1.1436841"
       height="1.3839902">
      <feGaussianBlur
         stdDeviation="1.5"
         result="blur"
         id="glow-blur" />
      <feMerge
         id="glow-merge">
        <feMergeNode
           in="blur"
           id="glow-node1" />
        <feMergeNode
           in="SourceGraphic"
           id="glow-node2" />
      </feMerge>
    </filter>
  </defs>
  <sodipodi:namedview
     id="namedview20"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1.6377121"
     inkscape:cx="123.95341"
     inkscape:cy="111.13065"
     inkscape:window-width="1792"
     inkscape:window-height="1005"
     inkscape:window-x="0"
     inkscape:window-y="31"
     inkscape:window-maximized="1"
     inkscape:current-layer="svg1" />
  <rect
     x="0"
     y="0"
     width="300"
     height="200"
     fill="#ffffff"
     stroke="#999999"
     stroke-width="1"
     id="rect-bg"
     style="fill:#ffffff;fill-opacity:1" />
  <!-- PRELOAD label -->
  <text
     x="149.48438"
     y="33"
     font-family="Arial, sans-serif"
     font-size="24px"
     font-weight="bold"
     font-style="italic"
     fill="#b22222"
     text-anchor="end"
     id="preload-label"><tspan
       style="text-align:center;text-anchor:middle"
       id="tspan1">PRELOAD</tspan></text>
  <!-- FETCH label -->
  <text
     x="149.02148"
     y="187"
     font-family="Arial, sans-serif"
     font-size="24px"
     font-weight="bold"
     font-style="italic"
     fill="#1e90ff"
     text-anchor="end"
     id="fetch-label"><tspan
       style="text-align:center;text-anchor:middle"
       id="tspan2">FETCH</tspan></text>
  <!-- Link tag box -->
  <rect
     x="25"
     y="47"
     width="250"
     height="30"
     rx="4"
     fill="#fffcf5"
     stroke="#daa520"
     stroke-width="1.5"
     id="link-box" />
  <text
     x="150"
     y="66"
     font-family="'Courier New', monospace"
     font-size="12px"
     font-weight="bold"
     fill="#8b4513"
     text-anchor="middle"
     id="link-text">&lt;link rel=&quot;preload&quot; as=&quot;fetch&quot;&gt;</text>
  <!-- Downward arrow (data flow) -->
  <line
     x1="150"
     y1="82"
     x2="150"
     y2="115"
     stroke="#daa520"
     stroke-width="2.09763"
     id="arrow-line" />
  <polygon
     points="144,112 150,122 156,112 "
     fill="#daa520"
     id="arrow-head"
     transform="translate(0,2)" />
  <!-- Reuse badge -->
  <rect
     x="163.74857"
     y="89.856598"
     width="50.10994"
     height="18.750477"
     rx="8"
     fill="#daa520"
     filter="url(#glow)"
     id="reuse-badge" />
  <text
     x="188.60709"
     y="102.64245"
     font-family="Arial, sans-serif"
     font-size="9px"
     font-weight="bold"
     fill="#ffffff"
     text-anchor="middle"
     id="reuse-text"
     style="font-size:10.6667px">REUSE</text>
  <!-- Fetch box -->
  <rect
     x="25"
     y="128"
     width="250"
     height="30"
     rx="4"
     fill="#f0f8ff"
     stroke="#1e90ff"
     stroke-width="1.5"
     id="fetch-box" />
  <text
     x="150"
     y="147"
     font-family="'Courier New', monospace"
     font-size="12px"
     font-weight="bold"
     fill="#0a1628"
     text-anchor="middle"
     id="fetch-text">fetch(url, { mode, credentials })</text>
</svg>
